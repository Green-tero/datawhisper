name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Key updates cover 3.12/3.14/3.15; the newest runtime stays
        # non-blocking until runner support settles.
        python-version: ["3.11", "3.12", "3.14", "3.15"]
        experimental: [false, false, false, true]
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry virtual environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-v2-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-poetry-v2-${{ matrix.python-version }}-

      - name: Install dependencies (DuckDB + Arrow extras)
        run: poetry install --with dev --extras "duckdb arrow" --no-interaction

      - name: Ruff (lint)
        run: poetry run ruff check .

      - name: Black (format check)
        run: poetry run black --check .

      - name: Mypy (strict typing)
        run: poetry run mypy datawhisper

      - name: Pytest (security, privacy, graph and engine suites)
        run: poetry run pytest -v
