[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "datawhisper"
version = "1.2.1"
description = "Zero-trust agentic data analysis and CI/CD database governance engine with graph-pruned context, Arrow pipelines and PII-safe outputs."
authors = ["DataWhisper Maintainers <maintainers@datawhisper.local>"]
license = "Apache-2.0"
readme = "README.md"
keywords = ["sql", "ai-agents", "sqlite", "duckdb", "postgres", "parquet", "arrow", "github-actions"]
packages = [{ include = "datawhisper" }]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.7"
typer = ">=0.12"
rich = ">=13.7"
sqlglot = ">=23.0,<27.0"
requests = "^2.31"
plotly = "^5.22"
pyarrow = { version = ">=15.0", optional = true }
polars = { version = ">=1.0", optional = true }
duckdb = { version = ">=1.0", optional = true }
psycopg = { version = "^3.1", optional = true, extras = ["binary"] }
openai = { version = ">=1.30", optional = true }
google-generativeai = { version = ">=0.6", optional = true }

[tool.poetry.extras]
arrow = ["pyarrow", "polars"]
duckdb = ["duckdb"]
postgres = ["psycopg"]
llm = ["openai", "google-generativeai"]
all = ["pyarrow", "polars", "duckdb", "psycopg", "openai", "google-generativeai"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-mock = "^3.14"
mypy = "^1.10"
ruff = ">=0.4"
black = "24.10.0"
pre-commit = "^3.7"
types-requests = "^2.31"

[tool.poetry.scripts]
datawhisper = "datawhisper.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["datawhisper", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
exclude = ["tests"]

[[tool.mypy.overrides]]
module = [
    "duckdb.*",
    "pyarrow.*",
    "polars.*",
    "psycopg.*",
    "openai.*",
    "google.*",
    "streamlit.*",
    "plotly.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
